name: Build Screen Translator

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Buka ZIP project
        run: unzip -o ScreenTranslatorAndroid-source.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - - name: Perbaiki JVM target
  working-directory: project
  run: |
    python3 - <<'PY'
    from pathlib import Path
    p = Path("app/build.gradle.kts")
    s = p.read_text()
    s = s.replace(
        '    compileSdk = 36\n',
        '''    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
'''
    )
    p.write_text(s)
    PY

- name: Build APK
  working-directory: project
  run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
