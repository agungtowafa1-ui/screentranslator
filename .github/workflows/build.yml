name: Build Screen Translator

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Buka ZIP project
        run: |
          rm -rf project
          mkdir project
          unzip -q ScreenTranslatorAndroid-source.zip -d project

      - name: Cari folder Gradle
        working-directory: project
        run: |
          echo "Isi project:"
          find . -maxdepth 3 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Perbaiki JVM Java dan Kotlin
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  'compileSdk = 36',
                  'compileSdk = 35'
              )

              s = s.replace(
                  'sourceCompatibility = JavaVersion.VERSION_1_8',
                  'sourceCompatibility = JavaVersion.VERSION_17'
              )

              s = s.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_17'
              )

              s = s.replace(
                  'jvmTarget = "17"',
                  'jvmTarget = "17"'
              )

              p.write_text(s)

              print("app/build.gradle.kts sudah diperbaiki.")
          else:
              print("app/build.gradle.kts tidak ditemukan.")
          PY

      - name: Beri izin Gradle
        working-directory: project
        run: |
          chmod +x gradlew

      - name: Build APK
        working-directory: project
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-APK
          path: |
            project/app/build/outputs/apk/debug/*.apk
