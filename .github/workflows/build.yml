name: Build Screen Translator

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v6

      - name: Buka ZIP project
        run: |
          rm -rf project _src
          mkdir project
          mkdir _src
          unzip -q ScreenTranslatorAndroid-source.zip -d _src

          if [ -f "_src/settings.gradle.kts" ]; then
            cp -a _src/. project/
          else
            ROOT=$(find _src -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -a "$ROOT"/. project/
          fi

          test -f project/settings.gradle.kts
          test -d project/app

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Paksa Java dan Kotlin ke JVM 17
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('JavaVersion.VERSION_8', 'JavaVersion.VERSION_17')
          s = s.replace('sourceCompatibility = "1.8"', 'sourceCompatibility = JavaVersion.VERSION_17')
          s = s.replace('targetCompatibility = "1.8"', 'targetCompatibility = JavaVersion.VERSION_17')
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace("jvmTarget = '1.8'", 'jvmTarget = "17"')

          p.write_text(s)

          print("=== build.gradle.kts setelah diperbaiki ===")
          print(s)
          PY

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle --no-daemon :app:assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
